<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MohamadMahdi Esmailiyan — Data Scientist and AI Engineer." />
    <meta name="theme-color" content="#f7f8fb" />
    <title>MohamadMahdi Esmailiyan — Academic Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500&amp;family=Vazirmatn:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="profile-details.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="profile-card" aria-labelledby="profile-name">
        <header class="card-header">
          <a class="monogram" href="#top" aria-label="Home">ME<span></span></a>
          <button class="language-toggle" type="button" aria-label="Switch to Persian" aria-pressed="false"><i data-lucide="languages" aria-hidden="true"></i><span>فارسی</span></button>
        </header>
        <section class="profile" id="top">
          <h1 id="profile-name" data-i18n="name"></h1><p class="bio" data-i18n="bio"></p>
          <div class="profile-meta">
            <div class="interests-card"><span class="interests-icon"><i data-lucide="brain-circuit" aria-hidden="true"></i></span><div><p class="meta-label" data-i18n="interestsLabel"></p><p class="meta-value" data-i18n="title"></p></div></div>
            <div class="institution-card"><span class="institution-icon"><i data-lucide="landmark" aria-hidden="true"></i></span><div><p class="meta-label" data-i18n="institutionLabel"></p><p class="meta-value" data-i18n="institution"></p></div></div>
          </div>
        </section>
        <section class="links-section" aria-labelledby="links-title">
          <div class="section-heading"><span></span><h2 id="links-title" data-i18n="connect"></h2><span></span></div>
          <nav class="quick-links" id="quick-links" aria-label="Contact links"></nav>
        </section>
        <!-- <footer><span data-i18n="footer"></span></footer> -->
      </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="script.js"></script>
  </body>
</html>
